function createQuestionSelection() {
  const selection = {};
  questionPools.forEach((pools, i) => pools.forEach((pool, j) => {
    const key = i + '-' + j;
    let seen = Array.isArray(questionHistory[key]) ? questionHistory[key].filter(n => Number.isInteger(n) && n >= 0 && n < pool.length) : [];
    let available = pool.map((_, n) => n).filter(n => !seen.includes(n));
    if (!available.length) {
      // Auch beim Beginn eines neuen Durchlaufs keine direkte Wiederholung.
      available = pool.map((_, n) => n).filter(n => n !== seen[seen.length - 1]);
      seen = [];
    }
    const chosen = available[Math.floor(Math.random() * available.length)];
    selection[key] = chosen;
    questionHistory[key] = [...seen, chosen];
  }));
  try { localStorage.setItem(historyKey, JSON.stringify(questionHistory)); } catch {}
  return selection;
}

    // Alte Spielstände behalten ihre bisherigen Originalfragen.
    if (!Number.isInteger(game.selection[key]) || !pool[game.selection[key]]) game.selection[key] = 0;
  }));
}

  const [a,b]=game.scores,tie=a===b,winner=a>b?0:1,order=tie?[0,1]:[winner,1-winner];
  const trophy=`<svg class="trophy" viewBox="0 0 180 180" aria-hidden="true"><defs><linearGradient id="cupGold" x1="0" x2="1" y2="1"><stop stop-color="#fff2b7"/><stop offset=".55" stop-color="#edc259"/><stop offset="1" stop-color="#ae7a23"/></linearGradient></defs><circle cx="90" cy="85" r="73" fill="#ffe18a0d" stroke="#ffe18a44"/><path d="M54 45H29v18c0 24 16 35 36 36M126 45h25v18c0 24-16 35-36 36" fill="none" stroke="#e3b94f" stroke-width="9"/><path d="M51 32h78v39c0 25-15 43-32 47v21h25v13H58v-13h25v-21C66 114 51 96 51 71Z" fill="url(#cupGold)"/><path d="m90 49 7 15 17 2-12 12 3 17-15-8-15 8 3-17-12-12 17-2Z" fill="#93651d"/><path d="M55 155h70" stroke="#ffe8a0" stroke-width="5" stroke-linecap="round"/></svg>`;
  $('panel').innerHTML=`<div class="confetti" aria-hidden="true">${Array.from({length:38},(_,i)=>`<i style="--x:${(i*31)%100}%;--delay:${(i%9)*.16}s;--drift:${i%2?1:-1};--color:${['#ffe18a','#7ce4b0','#fff4cf','#c5a0ee'][i%4]}"></i>`).join('')}</div><section class="finale"><div class="finale-kicker">ATOMATELIER · DIE SIEGEREHRUNG</div>${trophy}<p class="champion-label">${tie?'DOPPELT STARK':'DER SIEG GEHT AN'}</p><h2 id="winnerTitle" tabindex="-1">${tie?'Unentschieden!':escapeHtml(game.names[winner])+'<span>gewinnt!</span>'}</h2><p class="finale-message">${tie?'Gleiche Punktzahl, gemeinsame Ehre. Ihr teilt euch den Pokal!':`Mit <strong>${game.scores[winner]} Punkten</strong> und <strong>${Math.abs(a-b)} Punkten Vorsprung</strong> holt ihr euch den Pokal!`}</p><div class="podium">${order.map((team,rank)=>`<article class="podium-card ${rank===0||tie?'champion':''}"><div class="place">${tie?'GEMEINSAM PLATZ 1':rank===0?'★ PLATZ 1 · GEWONNEN':'PLATZ 2 · STARK GESPIELT'}</div><h3>${escapeHtml(game.names[team])}</h3><div class="final-points">${game.scores[team]}<span>Punkte</span></div><p>${Object.values(game.used).filter(q=>q.team===team&&q.correct).length} richtige Antworten</p></article>`).join('')}</div><p class="finale-thanks">Großer Applaus für euch beide. Das war euer Chemie-Duell!</p><div class="result-actions"><button class="primary" id="repeat">Noch ein Duell spielen ↗</button><button class="secondary" id="overview">Zur Fragenwand</button></div></section>`;
  $('repeat').onclick=()=>{game=null;persist();setup()};$('overview').onclick=home;
  $('winnerTitle').focus();window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
